# Hot-reload development: run infra in Docker, apps on the host.
#   docker compose -f compose.yaml -f compose.dev.yaml up postgres redis minio minio-init mailpit caddy
#   pnpm dev                                   (site :3000, admin :3001)
#   cd backend && ./mvnw spring-boot:run       (api :8080)
services:
  caddy:
    depends_on: !reset []
    environment:
      SITE_UPSTREAM: host.docker.internal:3000
      ADMIN_UPSTREAM: host.docker.internal:3001
      API_UPSTREAM: host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
