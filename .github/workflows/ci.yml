name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, format check, unit + integration tests (Testcontainers)
        run: ./mvnw -B verify
      - name: OpenAPI document is up to date
        run: git diff --exit-code -- ../docs/api/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm api:generate && git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start stack
        run: docker compose up -d --build --wait
        env:
          SB_HTTP_PORT: "8088"
      - run: pnpm --filter @shikshablox/e2e install-browsers
      - run: pnpm e2e
        env:
          SB_HTTP_PORT: "8088"
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            compose.log
