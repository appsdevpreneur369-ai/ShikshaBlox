spring:
  application:
    name: shikshablox-backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime connects as a NON-owner role (no BYPASSRLS) so Row-Level Security applies.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shikshablox}
    username: ${DB_APP_USER:sb_app}
    password: ${DB_APP_PASSWORD:sb_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    # Migrations run as the schema owner.
    user: ${DB_OWNER_USER:sb_owner}
    password: ${DB_OWNER_PASSWORD:sb_owner_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false # table created by Flyway
      republish-outstanding-events-on-restart: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    mail:
      enabled: false # an SMTP outage must not take the API out of rotation
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

shikshablox:
  # Base domain for tenant subdomains, e.g. moriah.shikshablox.localhost
  base-domain: ${SB_BASE_DOMAIN:shikshablox.localhost}
  # Studio address used in notification emails (enquiries, approvals, reminders)
  admin-base-url: ${ADMIN_BASE_URL:http://admin.shikshablox.localhost}
  security:
    # Development defaults only; staging/prod refuse to start with "dev-only" secrets.
    jwt-secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me}
    data-key: ${SB_DATA_KEY:dev-only-data-key-change-me}
  storage:
    # s3 (MinIO / S3 / R2) or gcs (Google Cloud Storage with the workload identity)
    provider: ${STORAGE_PROVIDER:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:sb_minio}
    secret-key: ${S3_SECRET_KEY:sb_minio_dev_secret}
    private-bucket: ${S3_PRIVATE_BUCKET:sb-private}
    public-bucket: ${S3_PUBLIC_BUCKET:sb-public}
    # Browser-facing base URL of the public bucket (CDN in production)
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/sb-public}
    # Host used to sign private download links (must be reachable by browsers)
    signing-endpoint: ${S3_SIGNING_ENDPOINT:}
  site:
    # Public site's on-demand ISR endpoint, called after publishing
    revalidate-url: ${SITE_REVALIDATE_URL:}
    revalidate-secret: ${SITE_REVALIDATE_SECRET:}
    # Per-school public site URLs where schools have no platform subdomain yet (staging), e.g.
    # "moriah=https://moriah.example.run.app,greenfield=https://...". Used for message links.
    public-urls: ${SITE_PUBLIC_URLS:}
  mail:
    from: ${MAIL_FROM:ShikshaBlox <no-reply@shikshablox.localhost>}
  seed:
    # Creates the platform admin and demo schools on startup (idempotent). Never real people.
    enabled: ${SEED_ENABLED:false}
    password: ${SEED_PASSWORD:}
    superadmin-email: ${SEED_SUPERADMIN_EMAIL:superadmin@shikshablox.test}
    # Extra verified hosts per school, e.g. "moriah=moriah-site-xyz.a.run.app"
    extra-domains: ${SEED_EXTRA_DOMAINS:}

logging:
  level:
    root: INFO
    com.shikshablox: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs # JSON logs incl. MDC (requestId, tenantId)
